name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site
          cat src/index.part01 src/index.part02a src/index.part02b src/index.part03a src/index.part03b > _site/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('</body></html>', '<script src="./neutral-v3.js"></script>\n<script src="./decision-os.js"></script>\n</body></html>')
          p.write_text(s, encoding='utf-8')
          PY
          cp manifest.webmanifest service-worker.js icon.svg neutral-v3.js decision-os.js _site/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
